<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventure Realm - Arcade X</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Adventure Specific Page Styles */
        .adventure-banner {
            background: linear-gradient(180deg, rgba(7, 7, 10, 0.4) 0%, rgba(7, 7, 10, 0.95) 100%),
                        url('assets/sekiro.jpg') no-repeat center center/cover;
            position: relative;
        }
        /* Falling Sakura (Cherry Blossom) Animation */
        .sakura-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 2;
        }
        .petal {
            position: absolute;
            background: linear-gradient(135deg, #ffb7c5, #ff8da1);
            border-radius: 15% 70% 15% 70%;
            width: 12px;
            height: 8px;
            opacity: 0.7;
            animation: fall-sway 10s linear infinite;
        }
        /* Individual petals delay & positioning */
        .petal:nth-child(1) { left: 10%; width: 14px; height: 10px; animation-duration: 8s; animation-delay: 0s; }
        .petal:nth-child(2) { left: 25%; width: 10px; height: 7px; animation-duration: 11s; animation-delay: 2s; }
        .petal:nth-child(3) { left: 40%; width: 12px; height: 8px; animation-duration: 9s; animation-delay: 4s; }
        .petal:nth-child(4) { left: 55%; width: 15px; height: 11px; animation-duration: 7s; animation-delay: 1s; }
        .petal:nth-child(5) { left: 70%; width: 9px; height: 6px; animation-duration: 13s; animation-delay: 3s; }
        .petal:nth-child(6) { left: 85%; width: 13px; height: 9px; animation-duration: 10s; animation-delay: 5s; }
        .petal:nth-child(7) { left: 95%; width: 11px; height: 8px; animation-duration: 12s; animation-delay: 1.5s; }
