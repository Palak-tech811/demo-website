<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Feedback - Arcade X</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Feedback Specific Page Styles */
        .feedback-banner {
            background: linear-gradient(180deg, rgba(7, 7, 10, 0.4) 0%, rgba(7, 7, 10, 0.95) 100%),
                        url('assets/dark_castle.jpg') no-repeat center center/cover;
            position: relative;
            background-position: bottom center;
        }
        .feedback-wrapper {
            max-width: 700px;
            margin: 0 auto;
            background: #09090e;
            border: 2px solid rgba(57, 255, 20, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 
                        0 0 15px rgba(57, 255, 20, 0.05);
            border-radius: 16px;
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }
        /* Quest Board scan lines */
        .feedback-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
            animation: scanner-sweep 6s linear infinite;
            z-index: 10;
        }
