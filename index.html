<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade X - Ultimate Game Arena</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Home Page Custom Styles */
        .home-hero {
            background: radial-gradient(circle at center, rgba(13, 13, 25, 0.4) 0%, rgba(5, 5, 8, 0.95) 80%),
                        url('assets/dark_castle.jpg') no-repeat center center/cover;
            position: relative;
            z-index: 1;
        }
        .home-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, var(--bg-dark) 0%, transparent 100%),
                        radial-gradient(ellipse at 50% 50%, rgba(0, 240, 255, 0.1) 0%, transparent 70%);
            z-index: -1;
        }
        /* Cyberpunk Grid Background Overlay */
        .cyber-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            z-index: -1;
            transform: perspective(500px) rotateX(60deg) translateY(-20%);
            transform-origin: top center;
            animation: grid-scroll 20s linear infinite;
        }
