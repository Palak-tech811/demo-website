<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Realm - Arcade X</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Simulation Specific Page Styles */
        .simulation-banner {
            background: linear-gradient(180deg, rgba(7, 7, 10, 0.4) 0%, rgba(7, 7, 10, 0.95) 100%),
                        url('assets/dark_castle.jpg') no-repeat center center/cover;
            position: relative;
        }
        /* Flight Cockpit HUD Animation Widget */
        .hud-system-showcase {
            background: #09090e;
            border: 2px solid rgba(0, 255, 210, 0.15);
            border-radius: 16px;
            padding: 3rem;
            margin-top: 3rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hud-visor-frame {
            position: relative;
            width: 100%;
            max-width: 700px;
            height: 380px;
            border: 1px solid rgba(0, 255, 210, 0.3);
            border-radius: 12px;
            background: radial-gradient(circle, rgba(0, 255, 210, 0.03) 0%, rgba(0,0,0,0.85) 90%),
                        url('assets/dark_castle.jpg') no-repeat center center/cover;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 40px rgba(0, 255, 210, 0.2);
        }
